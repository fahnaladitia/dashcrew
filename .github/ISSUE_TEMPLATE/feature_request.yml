name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the README and the [Roadmap](https://github.com/fahnaladitia/dashcrew/wiki/Roadmap) first. Use neutral examples, no company names or internal domains.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What dashcrew would do. Commands, profile keys or generated files, if you have them in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do now, or other ways to solve it.
  - type: dropdown
    id: scope
    attributes:
      label: Who it is for
      options: [one stack (a platform or pack), every stack (core), one agent (an adapter), teams (knowledge, specs, release lines), not sure]
    validations:
      required: true
