name: dashcrew
description: >-
  Agent-agnostic AI coding toolkit for Flutter projects. Renders rules, roles,
  workflows and guards for Claude Code and Codex from one source.
version: 0.0.1
repository: https://github.com/fahnaladitia/dashcrew
issue_tracker: https://github.com/fahnaladitia/dashcrew/issues
topics:
  - flutter
  - ai
  - cli
  - claude-code
  - codex

environment:
  sdk: ^3.5.0

executables:
  dashcrew: dashcrew

dependencies:
  args: ^2.7.0
  mustache_template: ^2.0.6
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0
