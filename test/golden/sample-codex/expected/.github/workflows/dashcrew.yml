# Generated by dashcrew sync. Change ci in .ai/project.yaml and run dashcrew sync instead of editing this file.
name: dashcrew check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub global activate --source git https://github.com/fahnaladitia/dashcrew --git-ref 0123abc
      - run: dart pub global run dashcrew check
        env:
          GITHUB_TOKEN: ${{ github.token }}
